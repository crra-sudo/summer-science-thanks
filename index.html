<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご購入ありがとうございます | CRRA 夏の自由研究</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: linear-gradient(135deg, #0f1b2e 0%, #1a3a5c 50%, #0f2a4a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.97);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .check { font-size: 64px; margin-bottom: 16px; }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #666;
    font-size: 15px;
    margin-bottom: 36px;
    line-height: 1.7;
  }
  .divider {
    border: none;
    border-top: 1px solid #e8e8e8;
    margin: 0 0 28px;
  }
  .videos-label {
    font-size: 12px;
    font-weight: 700;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }
  .video-btn {
    display: block;
    background: linear-gradient(135deg, #1a3a5c, #2a5080);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 12px;
    font-size: 17px;
    font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .video-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(26,58,92,0.4);
  }
  .video-btn span {
    display: block;
    font-size: 13px;
    font-weight: 400;
    opacity: 0.75;
    margin-top: 4px;
  }
  .note {
    margin-top: 28px;
    font-size: 13px;
    color: #999;
    line-height: 1.8;
  }
  .note a { color: #1a3a5c; }
  .crra {
    margin-top: 28px;
    font-size: 11px;
    color: #ccc;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="check">✅</div>
  <h1>ご購入ありがとうございます！</h1>
  <p class="subtitle">
    CRRA 夏の自由研究 科学動画コンテンツ<br>
    下のボタンから動画をご覧いただけます。<br>
    このページをブックマークしておくといつでも視聴できます。
  </p>
  <hr class="divider">
  <p class="videos-label">動画コンテンツ（全2本）</p>
  <a class="video-btn" href="https://youtu.be/gOw-Av5MixU" target="_blank" rel="noopener">
    🎓 講義編
    <span>実験の原理・背景を学ぼう</span>
  </a>
  <a class="video-btn" href="https://youtu.be/gOivwBHfSPQ" target="_blank" rel="noopener">
    🧪 実験編
    <span>一緒に実験してみよう</span>
  </a>
  <p class="note">
    ご不明な点は <a href="mailto:info@crra.jp">info@crra.jp</a> までお問い合わせください。
  </p>
  <p class="crra">Carbon Recovering Research Agency</p>
</div>
</body>
</html>
